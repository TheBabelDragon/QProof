name: CI

on:
  push:
    branches: [main, feat/hackathon-platform-github-pages]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q --tb=short
      - name: Run Bell experiment
        run: |
          qproof run bell --shots 1024 --seed 42 --out bell_report.json
          python -c "import json; d=json.load(open('bell_report.json')); assert d['status']=='passed', d"
      - name: Negative path (wrong expected must fail)
        run: |
          python - <<'PY'
          from qproof import Circuit, Experiment, ExperimentStatus, run_experiment
          import numpy as np
          circ = Circuit(2).h(0).cx(0, 1)
          wrong = np.array([1.0, 0, 0, 0], dtype=np.complex128)
          exp = Experiment(
              experiment_id="neg",
              description="neg",
              claim="fail",
              circuit=circ,
              expected_amplitudes=wrong,
              expected_probabilities=np.abs(wrong)**2,
              shots=0,
          )
          r = run_experiment(exp)
          assert r.status == ExperimentStatus.FAILED, r.status
          print("negative test ok")
          PY

  pages:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feat/hackathon-platform-github-pages' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Adversarial campaign smoke
        run: qproof campaign --seed 42 --circuits 6 --max-qubits 2 --max-gates 5
      - name: Browser simulator unit tests
        run: node web/test_simulator.mjs
      - name: Independent browser oracle tests
        run: node web/test_oracle.mjs
      - name: Generate capabilities artifact
        run: |
          qproof capabilities > web/capabilities.json
          qproof run bell --shots 0 --out web/evidence/bell-state-v1.json || true

  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Refresh web artifacts
        run: |
          qproof capabilities > web/capabilities.json
          mkdir -p web/evidence
          qproof run bell --shots 1024 --seed 42 --out web/evidence/bell-state-v1.json
          qproof run hadamard --out web/evidence/hadamard-v1.json
          qproof run rx-pi --out web/evidence/rx-pi-v1.json
          qproof run phase --out web/evidence/global-phase-v1.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
